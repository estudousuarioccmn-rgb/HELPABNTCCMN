<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="2200" viewBox="0 0 1080 2200">
<rect width="1080" height="2200" fill="#fff"/>
<rect x="0" y="0" width="1080" height="175" rx="18" fill="#35148f"/>
<text x="38" y="72" font-family="Arial,sans-serif" font-size="58" font-weight="800" fill="#fff"><tspan fill="#fff">PÓS-TEXTUAL</tspan></text>
<text x="38" y="125" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#fff">ELEMENTOS DO TRABALHO ACADÊMICO (ABNT)</text>
<rect x="770" y="8" width="302" height="159" rx="18" fill="#fff"/>
<image href="https://ccmn.biblioteca.ufrj.br/templates/joomtic4/images/banner_logo.jpg" x="785" y="15" width="150" height="140" preserveAspectRatio="xMidYMid meet"/>
<rect x="865" y="8" width="207" height="159" rx="18" fill="#ffd629"/>
<text x="882" y="48" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">Orientação em</text>
<text x="882" y="69" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">normalização de</text>
<text x="882" y="90" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#111">trabalhos acadêmicos</text>
<text x="882" y="118" font-family="Arial,sans-serif" font-size="16" font-weight="800" fill="#35148f">HELPABNTCCMN</text>

<rect x="18" y="195" width="1044" height="155" rx="18" fill="#faf7ff"/>
<text x="38" y="230" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#35148f">Nesta parte estão incluídos os seguintes itens:</text>
<rect x="32" y="250" width="190" height="82" rx="14" fill="#eadcff"/><circle cx="127" cy="273" r="22" fill="#35148f"/><text x="127" y="281" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">1</text><text x="127" y="309" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#35148f">Referências</text><text x="127" y="327" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#e31b23">(obrigatório)</text><rect x="240" y="250" width="190" height="82" rx="14" fill="#dff0ff"/><circle cx="335" cy="273" r="22" fill="#35148f"/><text x="335" y="281" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">2</text><text x="335" y="309" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#35148f">Glossário</text><text x="335" y="327" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#35148f">(opcional)</text><rect x="448" y="250" width="190" height="82" rx="14" fill="#e5f5dc"/><circle cx="543" cy="273" r="22" fill="#35148f"/><text x="543" y="281" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">3</text><text x="543" y="309" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#35148f">Apêndice</text><text x="543" y="327" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#35148f">(opcional)</text><rect x="656" y="250" width="190" height="82" rx="14" fill="#fff1bf"/><circle cx="751" cy="273" r="22" fill="#35148f"/><text x="751" y="281" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">4</text><text x="751" y="309" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#35148f">Anexo</text><text x="751" y="327" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#35148f">(opcional)</text><rect x="864" y="250" width="190" height="82" rx="14" fill="#fbe0ed"/><circle cx="959" cy="273" r="22" fill="#35148f"/><text x="959" y="281" text-anchor="middle" font-family="Arial" font-size="21" font-weight="800" fill="#fff">5</text><text x="959" y="309" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#35148f">Índice</text><text x="959" y="327" text-anchor="middle" font-family="Arial" font-size="12" font-weight="700" fill="#35148f">(opcional)</text>

<rect x="18" y="370" width="1044" height="315" rx="18" fill="#f7efff"/>
<circle cx="58" cy="410" r="28" fill="#35148f"/><text x="58" y="420" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">1</text>
<text x="105" y="420" font-family="Arial" font-size="29" font-weight="800" fill="#35148f">REFERÊNCIAS <tspan fill="#e31b23">(obrigatório)</tspan></text>
<text x="45" y="470" font-family="Arial" font-size="21" fill="#111">▤</text>
<text x="125" y="462" font-family="Arial" font-size="18" fill="#111">Conjunto padronizado de elementos descritivos, retirados de um documento</text>
<text x="125" y="489" font-family="Arial" font-size="18" fill="#111">que permite sua identificação individual, conforme a NBR 6023, mesmo</text>
<text x="125" y="516" font-family="Arial" font-size="18" fill="#111">mencionados em notas de rodapé. (ABNT, 2025).</text>
<text x="125" y="557" font-family="Arial" font-size="18" fill="#111">A lista das publicações citadas na pesquisa, ou que serviram de fundamento</text>
<text x="125" y="584" font-family="Arial" font-size="18" fill="#111">para o desenvolvimento da mesma, deve constar de um capítulo à parte,</text>
<text x="125" y="611" font-family="Arial" font-size="18" fill="#111">denominado <tspan font-weight="800">Referências</tspan>.</text>
<rect x="785" y="438" width="250" height="130" rx="14" fill="#ffdfe5"/>
<text x="805" y="466" font-family="Arial" font-size="18" font-weight="800" fill="#e31b23">⚠ Atenção!</text>
<text x="805" y="495" font-family="Arial" font-size="15" fill="#111">Esta deve ser a nomenclatura</text>
<text x="805" y="517" font-family="Arial" font-size="15" fill="#111">adotada e não “Bibliografia”,</text>
<text x="805" y="539" font-family="Arial" font-size="15" fill="#111">como aparece em algumas</text>
<text x="805" y="561" font-family="Arial" font-size="15" fill="#111">publicações.</text>

<rect x="18" y="700" width="1044" height="205" rx="18" fill="#e5f3ff"/>
<circle cx="58" cy="740" r="28" fill="#1260b8"/><text x="58" y="750" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">2</text>
<text x="105" y="750" font-family="Arial" font-size="29" font-weight="800" fill="#35148f">GLOSSÁRIO <tspan font-size="21">(opcional)</tspan></text>
<text x="55" y="815" font-family="Arial" font-size="18" fill="#35148f">A–Z</text>
<text x="160" y="798" font-family="Arial" font-size="18" fill="#111">Relação de palavras ou expressões técnicas de uso restrito ou de sentido</text>
<text x="160" y="825" font-family="Arial" font-size="18" fill="#111">obscuro, utilizadas no texto, acompanhadas das respectivas definições.</text>
<text x="160" y="855" font-family="Arial" font-size="18" fill="#111">É um elemento opcional, elaborado em ordem alfabética.</text>

<rect x="18" y="920" width="1044" height="265" rx="18" fill="#e9f7e0"/>
<circle cx="58" cy="960" r="28" fill="#187a3a"/><text x="58" y="970" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">3</text>
<text x="105" y="970" font-family="Arial" font-size="29" font-weight="800" fill="#35148f">APÊNDICE <tspan font-size="21">(opcional)</tspan></text>
<text x="55" y="1030" font-family="Arial" font-size="18" fill="#35148f">▤</text>
<text x="150" y="1025" font-family="Arial" font-size="18" fill="#111">Elemento opcional que consiste em um <tspan font-weight="800">texto ou documento</tspan></text>
<text x="150" y="1052" font-family="Arial" font-size="18" fill="#111"><tspan font-weight="800">elaborado pelo autor</tspan>, a fim de complementar sua argumentação,</text>
<text x="150" y="1079" font-family="Arial" font-size="18" fill="#111">sem prejuízo da unidade nuclear do trabalho.</text>
<text x="150" y="1110" font-family="Arial" font-size="18" fill="#111">Os apêndices são identificados por letras maiúsculas consecutivas,</text>
<text x="150" y="1137" font-family="Arial" font-size="18" fill="#111">travessão e pelos respectivos títulos.</text>
<rect x="740" y="1005" width="295" height="135" rx="14" fill="#d5edca"/>
<text x="760" y="1034" font-family="Arial" font-size="18" font-weight="800" fill="#187a3a">Exemplos:</text>
<text x="760" y="1064" font-family="Arial" font-size="15" fill="#111"><tspan font-weight="800">APÊNDICE A</tspan> – A avaliação numérica de</text>
<text x="760" y="1085" font-family="Arial" font-size="15" fill="#111">células aleatórias totais aos quatro dias.</text>
<text x="760" y="1110" font-family="Arial" font-size="15" fill="#111"><tspan font-weight="800">APÊNDICE B</tspan> – Avaliação das células</text>
<text x="760" y="1131" font-family="Arial" font-size="15" fill="#111">musculares presentes nas caudas.</text>

<rect x="18" y="1200" width="1044" height="390" rx="18" fill="#fff4c9"/>
<circle cx="58" cy="1240" r="28" fill="#9b7800"/><text x="58" y="1250" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">4</text>
<text x="105" y="1250" font-family="Arial" font-size="29" font-weight="800" fill="#35148f">ANEXO <tspan font-size="21">(opcional)</tspan></text>
<text x="55" y="1315" font-family="Arial" font-size="18" fill="#35148f">▤</text>
<text x="150" y="1308" font-family="Arial" font-size="18" fill="#111">Elemento opcional, que consiste em um <tspan font-weight="800">texto ou documento</tspan></text>
<text x="150" y="1335" font-family="Arial" font-size="18" fill="#111"><tspan font-weight="800">não elaborado pelo autor</tspan>, que serve de fundamentação,</text>
<text x="150" y="1362" font-family="Arial" font-size="18" fill="#111">comprovação e ilustração.</text>
<text x="150" y="1395" font-family="Arial" font-size="18" fill="#111">Os anexos são identificados por letras maiúsculas consecutivas,</text>
<text x="150" y="1422" font-family="Arial" font-size="18" fill="#111">travessão e pelos respectivos títulos.</text>
<text x="150" y="1455" font-family="Arial" font-size="18" fill="#111">Na identificação dos anexos, quando esgotadas as letras do alfabeto,</text>
<text x="150" y="1482" font-family="Arial" font-size="18" fill="#111">devem ser utilizadas letras maiúsculas dobradas.</text>
<text x="150" y="1515" font-family="Arial" font-size="18" fill="#111">O destaque tipográfico (<tspan font-weight="800">negrito, itálico ou sublinhado</tspan>) deve ser o mesmo</text>
<text x="150" y="1542" font-family="Arial" font-size="18" fill="#111">da seção primária. Caso o anexo contenha referências, elas devem constar</text>
<text x="150" y="1569" font-family="Arial" font-size="18" fill="#111">no próprio elemento em nota de rodapé ou constituir lista específica.</text>
<rect x="770" y="1280" width="265" height="75" rx="14" fill="#f1c928"/>
<text x="790" y="1310" font-family="Arial" font-size="18" font-weight="800" fill="#fff">Exemplo:</text>
<text x="790" y="1340" font-family="Arial" font-size="16" fill="#111"><tspan font-weight="800">ANEXO A</tspan> — Página de rosto.</text>

<rect x="18" y="1605" width="1044" height="205" rx="18" fill="#f9e8f2"/>
<circle cx="58" cy="1645" r="28" fill="#35148f"/><text x="58" y="1655" text-anchor="middle" font-family="Arial" font-size="27" font-weight="800" fill="#fff">5</text>
<text x="105" y="1655" font-family="Arial" font-size="29" font-weight="800" fill="#35148f">ÍNDICE <tspan font-size="21">(opcional)</tspan></text>
<text x="55" y="1718" font-family="Arial" font-size="24" fill="#35148f">☷</text>
<text x="160" y="1715" font-family="Arial" font-size="18" fill="#111">É a lista de palavras ou frases, ordenadas segundo um determinado critério,</text>
<text x="160" y="1742" font-family="Arial" font-size="18" fill="#111">que localiza e remete para as informações contidas no texto.</text>
<text x="160" y="1770" font-family="Arial" font-size="18" fill="#111">O índice aparece no final da publicação.</text>

<rect x="0" y="1840" width="1080" height="360" fill="#35148f"/>
<text x="45" y="1900" font-family="Arial" font-size="22" font-weight="800" fill="#ffd629">♥ HELPABNTCCMN:</text>
<text x="300" y="1900" font-family="Arial" font-size="22" fill="#fff">lembre-se, normalizar é valorizar o seu trabalho!</text>
<text x="870" y="1900" font-family="Arial" font-size="20" fill="#fff">|  C R Anjos</text>
