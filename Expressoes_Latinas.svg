<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <rect width="1024" height="1536" fill="#f7f7fb"/>
  <rect width="1024" height="166" fill="#2e1b8f"/>
  <rect x="28" y="20" width="330" height="48" rx="24" fill="#4a119f"/>
  <text x="48" y="54" font-family="Arial,sans-serif" font-size="31" font-weight="700" fill="#fff">HELPABNTCCMN</text>
  <text x="40" y="125" font-family="Arial,sans-serif" font-size="70" font-weight="700" fill="#ffe52b">EXPRESSÕES LATINAS</text>
  <defs><clipPath id="logoClip"><rect x="710" y="15" width="286" height="132" rx="12"/></clipPath></defs>
  <image href="Notas.png" x="710" y="15" width="286" height="430" preserveAspectRatio="none" clip-path="url(#logoClip)"/>
  <rect x="28" y="190" width="968" height="135" rx="24" fill="#ece9fb"/>
  <text x="58" y="230" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#2e1b8f">ORIENTAÇÃO GERAL</text>
  <text x="58" y="268" font-family="Arial,sans-serif" font-size="22" fill="#222">As expressões latinas a seguir devem ser utilizadas somente em notas,</text>
  <text x="58" y="298" font-family="Arial,sans-serif" font-size="22" fill="#222">com exceção de <tspan font-style="italic" font-weight="700">apud</tspan>, que também pode ser utilizada no corpo do texto.</text>
  <text x="58" y="326" font-family="Arial,sans-serif" font-size="22" fill="#222">Todas as expressões latinas e suas abreviaturas devem ser apresentadas em <tspan font-style="italic">itálico</tspan>.</text>

  <rect x="28" y="350" width="968" height="190" rx="24" fill="#e3f7ed"/>
  <rect x="55" y="370" width="220" height="44" rx="22" fill="#c9f0dc"/>
  <text x="78" y="401" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#087b43">APUD</text>
  <text x="55" y="445" font-family="Arial,sans-serif" font-size="21" fill="#222"><tspan font-weight="700">Significado:</tspan> “citado por”. Utilizada para citações de citações,</text>
  <text x="55" y="474" font-family="Arial,sans-serif" font-size="21" fill="#222">quando não se teve acesso à obra original. Pode ser usada na nota ou no texto.</text>
  <text x="55" y="510" font-family="Arial,sans-serif" font-size="20" fill="#222"><tspan font-weight="700">Exemplo:</tspan> Segundo Massarani (<tspan font-style="italic">apud</tspan> Werneck, 2002, p. 80).</text>

  <rect x="28" y="565" width="968" height="57" rx="22" fill="#ddd9f7"/>
  <text x="58" y="603" font-family="Arial,sans-serif" font-size="29" font-weight="700" fill="#2e1b8f">EXPRESSÕES UTILIZADAS APENAS EM NOTAS</text>

  <g font-family="Arial,sans-serif" font-size="19" fill="#222">
    <rect x="28" y="645" width="470" height="112" rx="20" fill="#e8f6ee"/>
    <text x="50" y="679" font-size="24" font-weight="700" fill="#087b43"><tspan font-style="italic">Ibidem</tspan> ou <tspan font-style="italic">ibid.</tspan></text>
    <text x="50" y="708">na mesma obra.</text>
    <text x="50" y="736">Ex.: ³ WERNECK, 2002, p. 50.  ⁴ <tspan font-style="italic">Ibid.</tspan>, p. 51.</text>

    <rect x="526" y="645" width="470" height="112" rx="20" fill="#e9f2fb"/>
    <text x="548" y="679" font-size="24" font-weight="700" fill="#12629a"><tspan font-style="italic">Idem</tspan> ou <tspan font-style="italic">Id.</tspan></text>
    <text x="548" y="708">do mesmo autor.</text>
    <text x="548" y="736">Ex.: ⁸ MINAYO, 2021, p. 9.  ⁹ <tspan font-style="italic">Id.</tspan>, 2006, p. 12.</text>

    <rect x="28" y="775" width="470" height="170" rx="20" fill="#f2edff"/>
    <text x="50" y="810" font-size="22" font-weight="700" fill="#2e1b8f"><tspan font-style="italic">Opus citatum / opere citato</tspan></text>
    <text x="50" y="839" font-size="22" font-weight="700" fill="#2e1b8f">ou <tspan font-style="italic">op. cit.</tspan> — obra citada.</text>
    <text x="50" y="872">Usada quando uma obra já foi referenciada</text>
    <text x="50" y="898">anteriormente, mas não logo em seguida.</text>
    <text x="50" y="928">Ex.: ¹¹ MORAES, <tspan font-style="italic">op. cit.</tspan>, p. 28.</text>

    <rect x="526" y="775" width="470" height="170" rx="20" fill="#fff6cc"/>
    <text x="548" y="810" font-size="24" font-weight="700" fill="#7b5d00"><tspan font-style="italic">Passim</tspan></text>
    <text x="548" y="840">aqui e ali, em diversas passagens.</text>
    <text x="548" y="873">Utilizada quando a informação citada consta</text>
    <text x="548" y="899">em diversos trechos da mesma fonte consultada.</text>
    <text x="548" y="929">Ex.: FAORO, 1976, <tspan font-style="italic">passim</tspan>.</text>

    <rect x="28" y="963" width="470" height="155" rx="20" fill="#e9f2fb"/>
    <text x="50" y="998" font-size="23" font-weight="700" fill="#12629a"><tspan font-style="italic">Loco citato</tspan> ou <tspan font-style="italic">loc. cit.</tspan></text>
    <text x="50" y="1028">lugar citado; refere-se ao mesmo trecho</text>
    <text x="50" y="1054">ou página já mencionados.</text>
    <text x="50" y="1091">Ex.: VIANNA, <tspan font-style="italic">loc. cit.</tspan></text>

    <rect x="526" y="963" width="470" height="155" rx="20" fill="#e8f6ee"/>
    <text x="548" y="998" font-size="23" font-weight="700" fill="#087b43"><tspan font-style="italic">Conferre</tspan> ou <tspan font-style="italic">Cf.</tspan></text>
    <text x="548" y="1028">confira, confronte; recomenda consultar</text>
    <text x="548" y="1054">outra obra ou nota do mesmo trabalho.</text>
    <text x="548" y="1091">Ex.: <tspan font-style="italic">Cf.</tspan> HOBSBAWN, 1991, p. 25.</text>

    <rect x="28" y="1136" width="968" height="130" rx="20" fill="#f2edff"/>
    <text x="50" y="1171" font-size="23" font-weight="700" fill="#2e1b8f"><tspan font-style="italic">Sequentia</tspan> ou <tspan font-style="italic">et seq.</tspan> — seguinte ou que segue.</text>
    <text x="50" y="1203">Utilizada para indicar a página citada e as páginas seguintes.</text>
    <text x="50" y="1237">Ex.: REGO, 1987, p. 253 <tspan font-style="italic">et seq.</tspan></text>
  </g>

  <rect x="28" y="1288" width="968" height="105" rx="22" fill="#ffe5e5"/>
  <rect x="52" y="1308" width="175" height="48" rx="24" fill="#d51d2e"/>
  <text x="78" y="1341" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#fff">ATENÇÃO</text>
  <text x="250" y="1324" font-family="Arial,sans-serif" font-size="19" fill="#222">As expressões <tspan font-style="italic">op. cit.</tspan>, <tspan font-style="italic">ibidem</tspan> (<tspan font-style="italic">ib.</tspan> ou <tspan font-style="italic">ibid.</tspan>)</text>
  <text x="250" y="1352" font-family="Arial,sans-serif" font-size="19" fill="#222">e <tspan font-style="italic">idem</tspan> (ou <tspan font-style="italic">Id.</tspan>) só podem ser usadas na mesma página ou folha.</text>

  <rect y="1415" width="1024" height="121" fill="#2e1b8f"/>
  <text x="70" y="1454" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#ffe52b">💛 HELPABNTCCMN:</text>
  <text x="290" y="1454" font-family="Arial,sans-serif" font-size="22" fill="#fff">lembre-se, normalizar é valorizar o seu trabalho!</text>
  <text x="70" y="1492" font-family="Arial,sans-serif" font-size="18" fill="#fff">@bibliotecaccmn.ufrj.br   •   biblioteca.ccmn.ufrj.br   •   helpabntccmn@outlook.com</text>
  <text x="840" y="1454" font-family="Arial,sans-serif" font-size="20" fill="#fff">|  C R Anjos</text>
</svg>