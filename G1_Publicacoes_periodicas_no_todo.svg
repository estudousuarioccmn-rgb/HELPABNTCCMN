<text x="305" y="1012" fill="#15134b" font-family="Arial,sans-serif" font-size="21">O título da publicação permanece em fonte normal,</text><text x="305" y="1044" fill="#15134b" font-family="Arial,sans-serif" font-size="21">sem negrito, conforme o critério definido para o projeto.</text><rect x="282" y="1082" width="700" height="193" rx="14" fill="#f3f1ff" stroke="#fff" stroke-width="2"/><text x="305" y="1123" fill="#15134b" font-family="Arial,sans-serif" font-size="21">O modelo 2 inclui ISSN, periodicidade, notas sobre</text><text x="305" y="1155" fill="#15134b" font-family="Arial,sans-serif" font-size="21">títulos anteriores ou alterações de título e observações</text><text x="305" y="1187" fill="#15134b" font-family="Arial,sans-serif" font-size="21">sobre os tipos de índices, quando essas informações</text><text x="305" y="1219" fill="#15134b" font-family="Arial,sans-serif" font-size="21">estiverem disponíveis.</text>
