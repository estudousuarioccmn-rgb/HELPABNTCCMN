<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
<defs>
 <linearGradient id="top" x1="0" x2="1"><stop offset="0" stop-color="#32118f"/><stop offset="1" stop-color="#5421b8"/></linearGradient>
 <style>
  .t{font-family:Arial,Helvetica,sans-serif;fill:#17124f}
  .b{font-family:Arial,Helvetica,sans-serif;font-weight:700}
  .white{fill:#fff}
  .purple{fill:#24118f}.blue{fill:#143bc0}.green{fill:#075a21}
 </style>
</defs>
<rect width="1024" height="1536" fill="#fff"/>
<!-- header -->
<rect x="0" y="0" width="1024" height="145" rx="14" fill="url(#top)"/>
<text x="36" y="90" class="b white" font-size="74">CITA</text><text x="236" y="90" class="b" font-size="74" fill="#ffd51c">ÇÕES</text>
<text x="36" y="126" class="b white" font-size="23">EM TRABALHOS ACADÊMICOS</text>
<rect x="680" y="9" width="332" height="125" rx="18" fill="#ffd51c"/>
<rect x="684" y="9" width="120" height="125" rx="18" fill="#fff"/>
<text x="744" y="65" text-anchor="middle" class="b" font-size="34" fill="#e7b600">☿</text>
<text x="744" y="92" text-anchor="middle" class="b" font-size="17">BC/CCMN</text><text x="744" y="116" text-anchor="middle" class="t" font-size="22">UFRJ</text>
<text x="820" y="42" class="b" font-size="17">Orientação em</text><text x="820" y="65" class="b" font-size="17">normalização de</text><text x="820" y="88" class="b" font-size="17">trabalhos acadêmicos</text><text x="820" y="116" class="b" font-size="18" fill="#30209c">HELPABNTCCMN</text>
<!-- definition -->
<rect x="22" y="155" width="980" height="112" rx="16" fill="#f1e8fa"/>
<rect x="44" y="170" width="98" height="80" rx="10" fill="#fff" stroke="#30119b" stroke-width="7"/>
<path d="M64 192h58M64 213h58M64 234h38" stroke="#30119b" stroke-width="6" stroke-linecap="round"/>
<text x="166" y="188" class="t" font-size="22"><tspan class="b">Citação</tspan> é a “menção, no texto, de uma informação extraída de outra fonte”,</text>
<text x="166" y="217" class="t" font-size="21">podendo aparecer no texto ou em nota de rodapé.</text>
<text x="166" y="247" class="t" font-size="21">Elas podem ser de três tipos:</text>
<!-- three types -->
<rect x="22" y="275" width="374" height="122" rx="15" fill="#f1e6fa"/><rect x="402" y="275" width="274" height="122" rx="15" fill="#e3f0fb"/><rect x="682" y="275" width="320" height="122" rx="15" fill="#e7f5e7"/>
<text x="170" y="305" class="b purple" font-size="27">Direta</text><text x="170" y="335" class="t" font-size="19">Transcrição textual</text><text x="170" y="359" class="t" font-size="19">de parte da obra do autor</text><text x="170" y="383" class="t" font-size="19">consultado.</text>
<text x="478" y="305" class="b blue" font-size="27">Indireta</text><text x="478" y="335" class="t" font-size="19">Texto baseado na obra</text><text x="478" y="359" class="t" font-size="19">consultada.</text>
<text x="758" y="305" class="b green" font-size="25">Citação de citação</text><text x="758" y="335" class="t" font-size="18">Citação direta ou indireta</text><text x="758" y="359" class="t" font-size="18">de um texto em que não se</text><text x="758" y="383" class="t" font-size="18">teve acesso ao original.</text>
<!-- direct -->
<rect x="22" y="408" width="980" height="375" rx="16" fill="#f4eafa"/>
<circle cx="57" cy="448" r="35" fill="#35129b"/><text x="57" y="461" text-anchor="middle" class="b white" font-size="34"> </text>
<text x="112" y="463" class="b blue" font-size="31">CITAÇÃO DIRETA</text>
<text x="405" y="440" class="t" font-size="20">É a cópia exata (transcrição fiel) das palavras do autor.</text><text x="405" y="467" class="t" font-size="20">Pode ser curta (até 3 linhas) ou longa (mais de 3 linhas).</text>
<rect x="176" y="476" width="380" height="282" rx="14" fill="#fff"/><rect x="576" y="476" width="408" height="282" rx="14" fill="#fff"/>
<rect x="194" y="487" width="350" height="36" rx="10" fill="#f3b9ef"/><text x="204" y="512" class="b blue" font-size="18">Citações curtas (até 3 linhas)</text>
<text x="201" y="545" class="t" font-size="18">• Devem ser inseridas no meio do</text><text x="218" y="568" class="t" font-size="18">parágrafo normal.</text><text x="201" y="594" class="t" font-size="18">• Obrigatoriamente entre aspas.</text>
<rect x="194" y="626" width="350" height="108" rx="12" fill="#f3e8fa"/><rect x="202" y="634" width="102" height="31" rx="8" fill="#c817c9"/><text x="213" y="656" class="b white" font-size="17">Exemplo:</text><text x="214" y="685" class="t" font-size="18">Segundo Silva (2023, p. 15),</text><text x="214" y="710" class="t" font-size="18">“o método científico é a base</text><text x="214" y="732" class="t" font-size="18">da pesquisa”.</text>
<rect x="594" y="487" width="370" height="36" rx="10" fill="#efb4e9"/><text x="604" y="512" class="b blue" font-size="18">Citações longas (mais de 3 linhas)</text>
<text x="599" y="545" class="t" font-size="18">• Devem ser destacadas do texto principal.</text><text x="599" y="570" class="t" font-size="18">• Recuo de 4 cm da margem esquerda.</text><text x="599" y="595" class="t" font-size="18">• Fonte menor (geralmente tamanho 10).</text><text x="599" y="620" class="t" font-size="18">• Espaçamento simples.</text><text x="599" y="645" class="t" font-size="18">• Sem aspas.</text>
<rect x="594" y="657" width="370" height="83" rx="12" fill="#dcecfb"/><rect x="604" y="665" width="105" height="31" rx="8" fill="#1687f7"/><text x="615" y="687" class="b white" font-size="17">Exemplo:</text><text x="644" y="711" class="t" font-size="16">A pesquisa científica constitui um processo</text><text x="644" y="730" class="t" font-size="16">sistemático de construção de conhecimento,</text><text x="644" y="749" class="t" font-size="16">(Silva, 2023, p. 15).</text>
<!-- indirect -->
<rect x="22" y="795" width="980" height="245" rx="16" fill="#e9f4fc"/>
<circle cx="57" cy="833" r="35" fill="#214cc2"/><text x="112" y="848" class="b blue" font-size="31">CITAÇÃO INDIRETA</text>
<text x="410" y="820" class="t" font-size="20">É a paráfrase, ou seja, você explica a ideia do autor consultado</text><text x="410" y="846" class="t" font-size="20">com as suas próprias palavras.</text>
<text x="226" y="884" class="t" font-size="18">• O texto expressa o pensamento do autor original.</text><text x="226" y="910" class="t" font-size="18">• Deve ser indicado o sobrenome do autor e o ano.</text><text x="226" y="936" class="t" font-size="18">• A indicação da página é opcional, mas o ano é obrigatório.</text>
<rect x="226" y="952" width="750" height="70" rx="12" fill="#dcecfb"/><rect x="238" y="962" width="105" height="31" rx="8" fill="#1687f7"/><text x="249" y="984" class="b white" font-size="17">Exemplo:</text><text x="360" y="980" class="t" font-size="17">A metodologia científica funciona como o alicerce fundamental</text><text x="360" y="1002" class="t" font-size="17">para o desenvolvimento de qualquer estudo acadêmico (Silva, 2023).</text>
<!-- apud -->
<rect x="22" y="1052" width="980" height="340" rx="16" fill="#eaf6e9"/>
<circle cx="57" cy="1092" r="35" fill="#087c25"/><text x="112" y="1106" class="b blue" font-size="30">CITAÇÃO DE CITAÇÃO (Apud)</text>
<text x="502" y="1080" class="t" font-size="18">É usada quando você quer citar um autor (autor original), mas não teve</text><text x="502" y="1104" class="t" font-size="18">acesso ao livro ou artigo dele. Você encontrou essa menção no texto</text><text x="502" y="1128" class="t" font-size="18">de um segundo autor (autor consultado).</text>
<text x="212" y="1170" class="t" font-size="18">• Utiliza-se a expressão <tspan class="b">apud</tspan> (que significa “citado por”).</text><text x="212" y="1196" class="t" font-size="18">• Estrutura: Autor original, <tspan class="b">apud</tspan> Autor consultado, ano consultado, página.</text><text x="212" y="1222" class="t" font-size="18">• Na lista de Referências, deve-se colocar apenas a obra que você leu fisicamente.</text>
<rect x="212" y="1238" width="372" height="94" rx="12" fill="#fff"/><rect x="594" y="1238" width="372" height="94" rx="12" fill="#fff"/>
<rect x="212" y="1238" width="372" height="35" rx="10" fill="#159b2e"/><text x="398" y="1261" text-anchor="middle" class="b white" font-size="16">Exemplo 1 – Autor inserido na frase</text>
<text x="225" y="1297" class="t" font-size="16">Segundo Weber <tspan class="b">apud</tspan> Santos, 2021, p. 60,</text><text x="225" y="1320" class="t" font-size="16">a definição de poder envolve a imposição</text>
<rect x="594" y="1238" width="372" height="35" rx="10" fill="#159b2e"/><text x="780" y="1261" text-anchor="middle" class="b white" font-size="16">Exemplo 2 – No final da frase</text>
<text x="607" y="1297" class="t" font-size="16">A definição de poder envolve a imposição</text><text x="607" y="1320" class="t" font-size="16">da vontade dentro de uma relação social</text><text x="607" y="1342" class="t" font-size="16">(Weber <tspan class="b">apud</tspan> Santos, 2021, p. 60).</text>
<rect x="212" y="1344" width="754" height="38" rx="10" fill="#fde1e1"/><circle cx="238" cy="1363" r="15" fill="#ef2525"/><text x="238" y="1370" text-anchor="middle" class="b white" font-size="22">!</text><text x="264" y="1371" class="b" font-size="18" fill="#e22b2b">Atenção!</text><text x="376" y="1371" class="b" font-size="16">Na lista de Referências, registre apenas a obra consultada.</text>
<!-- footer -->
<rect x="0" y="1408" width="1024" height="128" fill="#32118f"/>
<text x="80" y="1442" class="b" font-size="18" fill="#ffd51c">♥ HELPABNTCCMN:</text><text x="280" y="1442" class="b white" font-size="18">lembre-se, normalizar é valorizar o seu trabalho!</text><text x="846" y="1442" class="white" font-size="17">| C R Anjos</text>
<text x="48" y="1485" class="white" font-size="17">◎ @bibliotecaccmn.ufrj</text><text x="320" y="1485" class="white" font-size="17">|  biblioteca.ccmn.ufrj.br</text><text x="648" y="1485" class="white" font-size="17">|  helpabntccmn@outlook.com</text>
</svg>